<div class="detail-section">
  <div class="container-fluid">
    <!-- <img src="{{ product.imageUrl }}" class="detail-img" /> -->
    <img *ngIf="product?.imageUrl" [src]="product?.imageUrl" alt="Product Image">
    <!-- <h3>{{ product!.name }}</h3> -->
    <h3 *ngIf="product?.name">{{ product?.name }}</h3>
    <!-- <div class="price">{{ product!.unitPrice | currency : "USD" }}</div> -->
    <p *ngIf="product?.unitPrice">{{ product?.unitPrice }}</p>
    <button (click)="addToCart()" class="btn btn-primary btn-sm">
      Add to cart
    </button>

    <hr />
    <h4>Description</h4>
    <!-- <p>{{ product!.description }}</p> -->
    <p *ngIf="product?.description">{{ product?.description }}</p>

    <a routerLink="/products" class="mt-5">Back to Product List</a>
  </div>
</div>
