<h2>Order Reports</h2>
<table>
  <thead>
    <tr>
      <th>ID</th>
      <th>Customer Name</th>
      <th>Order Date</th>
      <th>Total Price</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let report of orderReports">
      <td>{{ report.id }}</td>
      <td>{{ report.customerName }}</td>
      <td>{{ report.orderDate | date }}</td>
      <td>{{ report.totalPrice | currency }}</td>
    </tr>
  </tbody>
</table>
<button class="mb-5 mt-3" routerLink="/products">Back to Products</button>
