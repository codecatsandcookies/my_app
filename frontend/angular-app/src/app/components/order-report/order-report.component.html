<h2 class="mt-5">Order Reports</h2>
<table class="table table-bordered">
  <thead>
    <tr>
      <th scope="col" >Customer</th>

      <th scope="col">Total Price</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let report of orderReports">
      
      <td>{{ report.customerName }}</td>

      <td>{{ report.totalPrice | currency }}</td>
    </tr>
  </tbody>
</table>
<button class="btn" routerLink="/products" style="color: blue">Back to Products</button>
