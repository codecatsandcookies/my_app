<!-- LOGIN PAGE -->
<div *ngIf="!authService.isLoggedIn()">
  <router-outlet></router-outlet>
</div>

<div class="page-wrapper" *ngIf="authService.isLoggedIn()">
  <!-- MENU SIDEBAR-->
  <aside  class="menu-sidebar d-none d-lg-block">
    <div class="logo">
      <a routerLink="/products">
        <img src="assets/images/logo.png" alt="luv2shop" class="img-responsive" />
      </a>
    </div>

    <app-product-category-menu></app-product-category-menu>
  </aside>
  <!-- END MENU SIDEBAR-->

  <div  class="page-container">
    <!-- HEADER DESKTOP-->
    <header  class="header-desktop">
      <div  class="section-content section-content-p30">
        <div class="container-fluid">
          <div class="header-wrap">
            <app-search></app-search>
            <button (click)="cancelOrder()" class="btn btn-danger">
              Cancel Latest Order
            </button>
            <button class="btn btn-primary btn-sm" (click)="navigateToReports()">
              View Order Reports
            </button>
            <button class="btn btn-primary btn-sm" *ngIf="authService.isLoggedIn()" (click)="logout()">Logout</button>
            <app-cart-status></app-cart-status>
          </div>
          <div class="account-wrap"></div>
        </div>
      </div>
    </header>
    <!-- END HEADER DESKTOP-->

    <!-- MAIN CONTENT-->
    <router-outlet></router-outlet>
  </div>
</div>

<!-- FOOTER (Visible only if logged in) -->
<footer *ngIf="authService.isLoggedIn()">
  <ul>
    <li><a href="#">About Us</a></li>
    <li><a href="#">Contact Us</a></li>
    <li><a href="#">Help</a></li>
  </ul>
</footer>
